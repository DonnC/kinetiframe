name: Feature request
description: Suggest an animation workflow or improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to make?
      description: Describe the workflow and where the app gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
      description: Do not upload someone else's work without permission.
